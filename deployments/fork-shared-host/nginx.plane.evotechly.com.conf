# Host nginx vhost for plane.evotechly.com on Contabo 13.140.219.161.
# Sibling: postiz.evotechly.com must keep its own server_name and upstream.
# Do not bind Plane's bundled Caddy to public 80/443.
# DNS and certificate issuance are out of scope for the readiness task;
# drop this file in sites-available after certs exist.
#
# Upstream is Plane Caddy on loopback:
#   127.0.0.1:18080  ->  proxy container :80
# Do not use 4007 (Postiz), 8080 (Temporal UI if published), 80, or 443.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name plane.evotechly.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plane.evotechly.com;

    ssl_certificate     /etc/letsencrypt/live/plane.evotechly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plane.evotechly.com/privkey.pem;

    client_max_body_size 10m;

    # Live collaboration is proxied by Plane Caddy at /live/* (websocket).
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
